name: eval

# Runs the RAG evaluation (backend/evaluation) against the live services —
# Chroma Cloud, OpenAI, Cohere, Langfuse. It imports the pipeline and runs it on
# the GitHub runner; it does NOT touch the AWS deployment.
#
# Manual only — click "Run workflow" on the Actions tab (or `gh workflow run
# eval.yml`). The full 30-item dataset is ~8-20 min and ~150-210 OpenAI calls,
# so it is not wired to push/PR. To run it on a schedule instead, add e.g.
#   schedule:
#     - cron: "0 6 * * 1"   # 06:00 UTC every Monday
#
# Secrets: all required keys live in one GitHub secret, APP_ENV, holding the
# full contents of backend/app.env (KEY=value per line). The "Load secrets
# from app.env" step below parses it and exports each key into $GITHUB_ENV
# for the rest of the job.

on:
  workflow_dispatch:

# Don't let two manual runs on the same ref overlap.
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Load secrets from app.env
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* ]] && continue
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done <<< "${{ secrets.APP_ENV }}"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install deps (serving only — no ingestion, no dev)
        run: uv sync --frozen --no-dev

      - name: Run evaluation
        run: uv run python -m evaluation.run_evaluation
        env:
          LANGFUSE_HOST: https://cloud.langfuse.com

      - name: Upload results.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_number }}
          path: backend/evaluation/results.json

      # Optional regression gate — uncomment to fail the job when the pass rate
      # drops. Judge metrics have some variance, so keep the bar lenient.
      # - name: Gate on task_success
      #   run: |
      #     uv run python -c "
      #     import json, sys
      #     agg = json.load(open('evaluation/results.json'))['aggregate']
      #     ts = agg.get('task_success') or 0
      #     print(f'task_success = {ts}')
      #     sys.exit(0 if ts >= 0.7 else 1)
      #     "