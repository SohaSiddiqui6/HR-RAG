[project]
name = "hr-rag"
version = "0.1.0"
description = "Retrieval-augmented Q&A over HR / company policy documents"
requires-python = ">=3.10"
dependencies = [
    # web
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-dotenv>=1.0,<2",
    # vector store (Chroma Cloud, dense + sparse/BM25)
    "chromadb>=1.4,<2",  # server-side hybrid Search API (Search/Knn/Rrf/Schema)
    "snowballstemmer>=2.2,<3",
    # retrieval + generation
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langchain-cohere>=0.3,<0.4",
    "cohere>=5.5,<6",
    "openai>=1.30,<2",
    # observability
    "langfuse>=4.15,<5",  # request tracing + evaluation orchestration
    # conversation store (Postgres / Supabase in prod, SQLite in tests)
    "sqlmodel>=0.0.24,<1",
    "psycopg[binary]>=3.2,<4",
    # escalation (Slack webhook) + FastAPI TestClient
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]
# Ingestion only — Docling / transformers / PyMuPDF pull in torch (~2 GB) and the
# request path never imports them. The serving image skips this group; run
# `uv sync --group ingestion` locally (or in a dedicated ingestion job) to enable
# `python -m src.rag.ingest` and `POST /api/ingest`.
ingestion = [
    "docling>=2.0,<3",
    "transformers>=4.40,<5",
    "pymupdf>=1.24,<2",
]

[tool.uv]
package = false
