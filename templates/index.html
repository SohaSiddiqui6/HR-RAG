<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-RAG</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <h1>HR Policy Assistant</h1>
    <p>Ask a question about company policies.</p>

    <div id="messages"></div>

    <form id="chat-form">
      <input type="text" id="question" placeholder="e.g. How much PTO do I get?" autocomplete="off" />
      <button type="submit">Ask</button>
    </form>
  </main>

  <script src="/static/chat.js"></script>
</body>
</html>
