[project]
name = "hr-rag"
version = "0.1.0"
description = "Retrieval-augmented Q&A over HR / company policy documents"
requires-python = ">=3.10"
dependencies = [
    # web
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "python-dotenv>=1.0,<2",
    # ingestion (Docling PDF parsing + chunking)
    "docling>=2.0,<3",
    "transformers>=4.40,<5",
    "pymupdf>=1.24,<2",
    # vector store (Chroma Cloud, dense + sparse/BM25)
    "chromadb>=1.4,<2",  # server-side hybrid Search API (Search/Knn/Rrf/Schema)
    "snowballstemmer>=2.2,<3",
    # retrieval + generation
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langchain-cohere>=0.3,<0.4",
    "cohere>=5.5,<6",
    "openai>=1.30,<2",
    # observability
    "langfuse>=4.15,<5",  # request tracing + evaluation orchestration
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",  # FastAPI TestClient
]

[tool.uv]
package = false
